<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo Caramujo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1> 🐌🛍️ Catálogo Caramujo</h1>
    <p>Encontre o que você procura de forma simples e rápida!</p>
  </header>

  <!-- Campo de busca principal -->
  <section class="busca-container">
    <input type="text" id="campo-busca" placeholder="Digite o nome do produto..." />
  </section>

  <!-- Categorias -->
  <nav class="menu-categorias">
    <button class="categoria ativa" data-categoria="todos">Todos</button>
    <button class="categoria" data-categoria="potes">Potes</button>
    <button class="categoria" data-categoria="copos">Copos</button>
    <button class="categoria" data-categoria="sacolas">Sacolas</button>
  </nav>

  <!-- Catálogo -->
  <main>
    <div id="catalogo" class="catalogo"></div>
  </main>

  <footer>
    <p>© 2025 - Catálogo Simples | Desenvolvido para facilitar suas compras</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
